<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corgi VPN</title>
<meta name="theme-color" content="#f28c28">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#fff7ec;--ink:#241a12;--muted:#7a5a3c;--orange:#f28c28;--mint:#43d69a;--surface:#fff;--line:#f0dcc0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 90% -10%,rgba(242,140,40,.18),transparent 55%),var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px 32px;max-width:400px;width:100%;box-shadow:0 18px 40px rgba(122,74,22,.1);text-align:center}
h1{margin:0 0 8px;font-size:1.5rem}
p{margin:0 0 16px;color:var(--muted);line-height:1.5}
.mascot{font-size:96px;line-height:1;margin:8px 0 16px;transition:transform .6s cubic-bezier(.22,.7,.2,1);filter:grayscale(.3);opacity:.85}
.mascot.on{filter:none;opacity:1;animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.04)}}
.btn{appearance:none;border:none;cursor:pointer;font-weight:800;padding:14px 22px;border-radius:14px;font-size:15px;background:var(--orange);color:#fff}
.btn.on{background:#2a9d6e}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:var(--muted);padding:6px 12px;border-radius:99px;border:1px solid var(--line);margin-bottom:12px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.on{color:var(--mint)}
.status.on .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(67,214,154,.2)}
.note{font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="status" id="status"><span class="dot"></span><span id="st">Desconectado</span></div>
  <div class="mascot" id="mascot" aria-hidden="true">😴🐶</div>
  <h1>Corgi VPN</h1>
  <p id="desc">El corgi está dormido. Tocá conectar.</p>
  <button class="btn" id="btn" type="button">Conectar demo</button>
  <p class="note">Deploy de emergencia funcionando. Para la versión con ilustraciones del corgi y catálogo VPN Gate, subí app.js + assets desde el proyecto local.</p>
</div>
<script>
const mascot=document.getElementById('mascot'),btn=document.getElementById('btn'),status=document.getElementById('status'),st=document.getElementById('st'),desc=document.getElementById('desc');
let on=false;
btn.onclick=()=>{on=!on;mascot.classList.toggle('on',on);btn.classList.toggle('on',on);status.classList.toggle('on',on);st.textContent=on?'Demo conectada':'Desconectado';btn.textContent=on?'Desconectar':'Conectar demo';mascot.textContent=on?'🐕✨':'😴🐶';desc.textContent=on?'Conectado (demo visual).':'El corgi está dormido. Tocá conectar.';};
</script>
</body>
</html>
